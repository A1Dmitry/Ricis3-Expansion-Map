<text x="286" y="258" text-anchor="end" font-size="15" fill="#cbd5e1">POLAR · RICIS arm</text><rect x="300" y="230" width="71.1" height="14" rx="3" fill="#475569"/><text x="379.1" y="242" font-size="13" fill="#475569" font-weight="700">0.3387</text><rect x="300" y="250" width="25.6" height="14" rx="3" fill="#dc2626"/><text x="333.6" y="262" font-size="13" fill="#dc2626" font-weight="700">0.1219</text><rect x="300" y="270" width="25.6" height="14" rx="3" fill="#16a34a"/><text x="333.6" y="282" font-size="13" fill="#16a34a" font-weight="700">0.1219</text><line x1="300" y1="226" x2="300" y2="290" stroke="#334155" stroke-width="1"/><text x="286" y="354" text-anchor="end" font-size="15" fill="#cbd5e1">POLAR · DLS ghost</text><rect x="300" y="326" width="17.1" height="14" rx="3" fill="#475569"/><text x="325.1" y="338" font-size="13" fill="#475569" font-weight="700">0.0816</text><rect x="300" y="346" width="213.5" height="14" rx="3" fill="#dc2626"/><text x="521.5" y="358" font-size="13" fill="#dc2626" font-weight="700">1.0165</text><rect x="300" y="366" width="21.6" height="14" rx="3" fill="#16a34a"/><text x="329.6" y="378" font-size="13" fill="#16a34a" font-weight="700">0.1027</text><line x1="300" y1="322" x2="300" y2="386" stroke="#334155" stroke-width="1"/><text x="286" y="450" text-anchor="end" font-size="15" fill="#cbd5e1">SYMBOLIC · RICIS arm</text><rect x="300" y="422" width="12.2" height="14" rx="3" fill="#475569"/><text x="320.2" y="434" font-size="13" fill="#475569" font-weight="700">0.0583</text><rect x="300" y="442" width="439.1" height="14" rx="3" fill="#dc2626"/><text x="747.1" y="454" font-size="13" fill="#dc2626" font-weight="700">2.0911</text><rect x="300" y="462" width="31.7" height="14" rx="3" fill="#16a34a"/><text x="339.7" y="474" font-size="13" fill="#16a34a" font-weight="700">0.1511</text><line x1="300" y1="418" x2="300" y2="482" stroke="#334155" stroke-width="1"/><text x="286" y="546" text-anchor="end" font-size="15" fill="#cbd5e1">SYMBOLIC · DLS gh