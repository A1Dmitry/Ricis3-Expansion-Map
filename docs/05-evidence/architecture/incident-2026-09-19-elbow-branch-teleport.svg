<rect x="40" y="668" width="1100" height="300" rx="10" fill="#0f172a" stroke="#334155"/>
<text x="60" y="698" font-size="17" fill="#f8fafc" font-weight="700">ПРИЧИНЫ (по порядку вклада)</text>
<text x="60" y="728" font-size="14" fill="#e2e8f0">1  Зеркало ветви применялось к РЕЗУЛЬТАТУ солвера, то есть к состоянию-входу следующего кадра.</text>
<text x="60" y="750" font-size="14" fill="#e2e8f0">    Скачок суставов = 2·|q2 − φ| = 1.0…2.1 рад за один кадр 16.7 мс (до 119.8°/кадр).</text>
<text x="60" y="780" font-size="14" fill="#e2e8f0">2  Зеркало — точное тождество планарного 2R: схват не двигается вовсе (&lt;1e-12 м).</text>
<text x="60" y="802" font-size="14" fill="#e2e8f0">    Поэтому все декартовы гейты (IK error, FK drift, delivery) остались зелёными — 2313/2313.</text>
<text x="60" y="832" font-size="14" fill="#e2e8f0">3  Триггер реактивный: гард срабатывает, когда локоть УЖЕ в полосе клиренса 0.02 м,</text>
<text x="60" y="854" font-size="14" fill="#e2e8f0">    то есть в момент максимально далёкой зеркальной позы — скачок всегда максимальный.</text>
<text x="60" y="884" font-size="14" fill="#e2e8f0">4  Нуль-пространства нет (якобиан 3×3 при 3-DOF цели) — смену ветви нельзя заменить</text>
<text x="60" y="906" font-size="14" fill="#e2e8f0">    сглаживанием цели; снизить можно только стоимость перехода.</text>
<text x="60" y="936" font-size="14" fill="#fbbf24">5  Механизм был задокументирован автором как «тупик» — но вывод перенесли только на</text>
<text x="60" y="958" font-size="14" fill="#fbbf24">    полярный солвер; для итеративных (символический RICIS, DLS-призрак) гард оставили.</text>

<rect x="40" y="986" width="1100" height="212" rx="10" fill="#052e16" stroke="#16a34a" stroke-width="2"/>
<text x="60" y="1016" font-size="17" fill="#86efac" font-weight="700">РЕМОНТ И ПРОВЕРКА</text>
<text x="60" y="1044" font-size="14" fill="#dcfce7">Восстановлена плавность движка до 591ecb9; зеркало применяется ограниченным по скорости</text>
<text x="60" y="1066" font-size="14" fill="#dcfce7">суставным переходом (smoothstep, 0.35 с, нулевая скорость на концах). FK / det(J) /</text>
<text x="60" y="1088" font-size="14" fill="#dcfce7">isSingularZone пересчитываются каждый кадр перехода — состояние не врёт о себе.</text>
<text x="60" y="1118" font-size="14" fill="#dcfce7">Телепорт устранён: 1.0165 → 0.1027 и 2.0911 → 0.1511 рад/кадр. Требование владельца</text>
<text x="60" y="1140" font-size="14" fill="#dcfce7">«локоть над полом» сохранено: min elbowZ ≥ +0.0147 м у обеих рук, доставка 4/4.</text>
<text x="60" y="1170" font-size="14" fill="#86efac" font-weight="700">Новый страж src/services/kinematic/elbowBranchContinuity.test.ts: на сломанном коде 3/5 красные</text>
<text x="60" y="1190" font-size="14" fill="#86efac" font-weight="700">(1.0165 / 2.0911 / 1.7812 рад), на исправленном 5/5 зелёные.</text>
</svg>