name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup Node
        uses: actions/setup-node@v7.0.0
        with:
          node-version: '22.23.2'
          cache: npm

      - name: Setup npm
        run: npm install --global npm@12.0.2 && npm --version

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v6.0.0
        with:
          enablement: true

      - name: Install dependencies
        run: npm ci

      - name: Verify release alignment and TypeScript
        run: npm run release:check && npm run lint

      - name: Run test suite
        run: npm test

      - name: Build static site
        env:
          GITHUB_PAGES: 'true'
        # Pages receives only the Vite client bundle; the Express server is not deployed.
        run: npx vite build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.0
