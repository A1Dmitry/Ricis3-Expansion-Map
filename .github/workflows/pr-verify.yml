name: Pull Request Verification

on:
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify TypeScript, tests and static build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v7.0.0
        with:
          node-version: '22'
          cache: npm
      - name: Verify npm
        run: npm --version
      - name: Install locked dependencies
        run: npm ci
      - name: Reject moderate-or-higher dependency vulnerabilities
        # Keep the audit on PR verification rather than the Pages deployment path: vulnerable
        # lockfiles stop before merge without turning an already-built release into an outage.
        run: npm run security:check
      - name: Verify release alignment and TypeScript
        run: npm run release:check && npm run lint
      - name: Toyota flow poka-yoke gate (TPS standard work), board and digest drift check
        # docs/00-governance/TOYOTA_TPS_WORKING_SYSTEM.md: the line stops when the working
        # process itself is violated (WIP overflow, open andon, "done" without a real run,
        # declared-vs-actual drift in normative docs, hand-edited board, hand-edited digest).
        run: npm run tps:gate && npm run tps:board:check && npm run tps:digest:check
      - name: Onboarding gate (G0: executor has read and accepted the documentation)
        # docs/00-governance/EXECUTION_TRACEABILITY_GATES.md §0: no work is accepted from an
        # executor without a valid attestation (sha256 of every mandatory document as present
        # in the tree + acceptance statement + comprehension answers).
        run: npm run onboarding:gate
      - name: Executor traceability gate (commit header «исполнитель : ключ», registered key, per-commit G0)
        # docs/00-governance/EXECUTION_TRACEABILITY_GATES.md: every commit on a PR branch must
        # carry the executor key in its header, matching the key registered in
        # docs/00-governance/EXECUTOR_KEY.md as of that commit, and the executor must have been
        # admitted (G0) for the document revisions of that commit; this keeps GitHub-history
        # attribution possible and enables G2 forensics (bisect -> verdict) on breakage.
        run: npm run executor:gate -- --check-headers --base origin/main
      - name: Run test suite
        run: npm test
      - name: Build static application without deployment
        env:
          GITHUB_PAGES: 'true'
        run: npm run generate:node-entries && npx vite build
